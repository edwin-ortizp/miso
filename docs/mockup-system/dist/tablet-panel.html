<body><!-- ANDAMIAJE · no existe en el producto. Es el índice de revisión común.

     En escritorio es la franja de siempre: arriba, a todo el ancho, por encima
     de la aplicación. Por debajo de 1024 px se convierte en una CORTINILLA: la
     barra compacta queda en el flujo y el cuerpo se despliega como overlay
     absoluto, así que la franja nunca empuja ni deforma el contenido y `Modal`
     sigue midiendo el alto real que ocupa (`.ui-andamio`).

     El rótulo de la barra es «Configuración del prototipo» a propósito: en
     móvil no queda sitio para la nota de la derecha, y sin nombre alguien
     tomaría la barra por una funcionalidad del producto. -->
<div class="ui-andamio" data-abierto="false">

  <!-- Solo visible en responsive. En escritorio la regla la oculta y el cuerpo
       vuelve a ser `display:contents`, o sea los mismos hijos flex de siempre. -->
  <button type="button" class="ui-andamio-barra" id="andamio-toggle"
          aria-expanded="false" aria-controls="andamio-cuerpo">
    <svg class="ui-andamio-marca" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"></path>
      <path d="M3 7l9 4.5L21 7"></path>
      <path d="M12 11.5V21"></path>
    </svg>
    <span class="ui-andamio-rotulo">Configuración del prototipo</span>
    <svg class="ui-andamio-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M6 9l6 6 6-6"></path>
    </svg>
  </button>

  <div class="ui-andamio-cuerpo" id="andamio-cuerpo">
    <span class="ui-andamio-titulo">Panel de pared</span>
    <div class="ui-andamio-grupo" id="andamio-pantallas"></div>
    <span class="ui-andamio-sep"></span>
    <!-- Controles de revisión que cada pantalla puede añadir y debe limpiar. -->
    <div class="ui-andamio-grupo" id="andamio-extra" hidden></div>
    <div class="ui-andamio-campo">
      <label for="andamio-escenario">Escenario</label>
      <select id="andamio-escenario"></select>
    </div>
    <button type="button" class="ui-paso" id="reset-data">Reiniciar</button>
    <span class="ui-andamio-nota">Andamiaje · fuera del producto</span>
  </div>
</div>

<!-- El velo atenúa la aplicación mientras la cortinilla está abierta. Vive
     FUERA de `.ui-andamio` para no contar en su alto, y por debajo de su
     z-index para que la cortinilla quede encima. -->
<div class="ui-andamio-velo" id="andamio-velo" hidden></div>

<script>
/* La cortinilla es del andamiaje, así que su comportamiento viaja con su
   markup y con su hoja: un mockup que incluya el rail lo tiene entero, sin
   declarar nada. */
(function () {
  var rail = document.querySelector('.ui-andamio');
  var boton = document.getElementById('andamio-toggle');
  var velo = document.getElementById('andamio-velo');
  if (!rail || !boton || !velo) return;

  function poner(abierto) {
    rail.dataset.abierto = String(abierto);
    boton.setAttribute('aria-expanded', String(abierto));
    velo.hidden = !abierto;
  }
  function abierta() { return rail.dataset.abierto === 'true'; }

  boton.addEventListener('click', function () { poner(!abierta()); });
  velo.addEventListener('click', function () { poner(false); });

  /* Elegir pantalla, escenario o reiniciar es la última acción de la visita a
     la cortinilla: se cierra sola para devolver la pantalla. */
  rail.addEventListener('click', function (e) {
    if (!abierta()) return;
    if (e.target.closest('#andamio-pantallas .ui-paso') || e.target.closest('#reset-data')) poner(false);
  });
  rail.addEventListener('change', function () { if (abierta()) poner(false); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && abierta()) poner(false);
  });

  /* Al volver a escritorio la cortinilla deja de existir; su estado abierto se
     quedaría puesto y reaparecería al siguiente estrechamiento. */
  var ancho = window.matchMedia('(min-width:1024px)');
  var alCambiar = function () { if (ancho.matches) poner(false); };
  if (ancho.addEventListener) ancho.addEventListener('change', alCambiar);
  else if (ancho.addListener) ancho.addListener(alCambiar);
})();
</script>

      if (mSearch) {
        const card = mSearch.closest(".lt-mcard");
        const on = card.classList.toggle("is-searching");
        card.querySelectorAll("[data-lt-mcard-search]").forEach((b) => b.setAttribute("aria-expanded", String(on)));
        if (on) card.querySelector(".lt-mcard__search input")?.focus();
        return;
      }
      const toggle = event.target.closest("[data-lt-toggle]");
      if (toggle) {
        const el = root.querySelector("#" + toggle.dataset.ltToggle);
        if (el) {
          closePopups(el);
          if (el.classList.contains("lt-multiselect__panel")) {
            const rect = toggle.getBoundingClientRect();
            const above = !compact() && innerHeight - rect.bottom < 280 && rect.top > innerHeight - rect.bottom;
            el.style.top = above ? "auto" : "";
            el.style.bottom = above ? "calc(100% + 4px)" : "";
          }
          el.hidden = !el.hidden;
          root.querySelectorAll('[data-lt-toggle="' + toggle.dataset.ltToggle + '"][aria-expanded]').forEach((b) => b.setAttribute("aria-expanded", String(!el.hidden)));
        }
        return;
      }
      const remove = event.target.closest("[data-lt-remove-filter]");
      const clear = event.target.closest("[data-lt-clear-filters]");
      if (remove || clear) {
        const card = (remove || clear).closest(".lt-mcard");
        const area = card || root;
        (clear ? area.querySelectorAll("[data-lt-remove-filter]") : [remove]).forEach((b) => {
          const chip = b.closest(".lt-chip");
          if (chip?.hasAttribute("data-zone-chip")) {
            dropStore("lt-health-zone");
            dropStore("lt-health-range");
          }
          chip?.remove();
        });
        const count = area.querySelectorAll("[data-lt-remove-filter]").length;
        const badge = area.querySelector("[data-lt-filter-count]");
        if (badge) {
          badge.textContent = count;
          badge.hidden = count === 0;
          badge.setAttribute("aria-label", count + (count === 1 ? " filtro activo" : " filtros activos"));
        }
        const link = area.querySelector("[data-lt-clear-filters].lt-link");
        if (link) link.hidden = count === 0;
        if (count === 0) {
          const counter = area.querySelector("[data-lt-visible-count]");
          if (counter) counter.textContent = "(" + (counter.dataset.total || "") + " / " + (counter.dataset.total || "") + ")";
          const foot = card?.querySelector("[data-range-all]");
          if (foot) {
            card.classList.add("is-unfiltered");
            foot.querySelector(".lt-mcard__range").innerHTML = foot.dataset.rangeAll;
            const compactPager = foot.querySelector(".lt-pager__compact");
            if (compactPager) compactPager.textContent = "1 / " + foot.dataset.pagesAll;
            const steps = foot.querySelectorAll(".lt-pager__step");
            if (steps[1]) steps[1].disabled = false;
          }
        }
        area.querySelectorAll(".lt-popover").forEach((p) => {
          p.hidden = true;
        });
        return;
      }
      if (!event.target.closest(".lt-popover,.lt-menu,.lt-dialog")) closePopups(null);
      if (event.target.closest(".lt-multiselect__option")) {
        const panel = event.target.closest(".lt-multiselect__panel");
        const picked = [...panel.querySelectorAll("input:checked")].map((i) => i.parentElement.textContent.trim());
        root.querySelector('[data-lt-toggle="' + panel.id + '"] span').textContent = picked.length ? picked.join(", ") : "Todos los tipos";
        return;
      }
      const action = event.target.closest("[data-lt-nav-toggle],[data-lt-open-drawer],[data-lt-close-drawer],[data-lt-static-nav],[data-lt-search]");
      if (!action) return;
      const shell = action.closest(".lt-shell");
      if (!shell) return;
      if (action.hasAttribute("data-lt-nav-toggle")) {
        shell.classList.toggle(compact() ? "is-drawer-open" : "is-rail");
        return;
      }
      if (action.hasAttribute("data-lt-open-drawer")) {
        shell.classList.add("is-drawer-open");
        return;
      }
      if (action.hasAttribute("data-lt-close-drawer")) {
        shell.classList.remove("is-drawer-open");
        return;
      }
      if (action.hasAttribute("data-lt-search")) {
        shell.querySelector("[data-lt-search-input]")?.focus();
        return;
      }
      toast("Este destino se muestra como referencia y no forma parte de este mockup.");
    });
    scope.on(window, "keydown", (event) => {
      if (event.key === "Escape") {
        closePopups(null);
        root.querySelectorAll(".lt-mcard.is-searching").forEach((c) => c.classList.remove("is-searching"));
      }
      if (event.key === "Escape") root.querySelector(".lt-shell")?.classList.remove("is-drawer-open");
    });
  }
  document.addEventListener("pointerdown", (event) => {
    const handle = event.target.closest(".lt-popover__handle");
    if (!handle || !matchMedia("(max-width: 767.98px)").matches) return;
    const sheet = handle.closest(".lt-popover");
    const start = event.clientY;
    let dy = 0;
    const move = (e) => {
      dy = Math.max(0, e.clientY - start);
      sheet.style.transform = `translateY(${dy}px)`;
    };
    const up = () => {
      removeEventListener("pointermove", move);
      removeEventListener("pointerup", up);
      sheet.style.transform = "";
      if (dy > 80) {
        sheet.hidden = true;
        document.querySelectorAll(`[data-lt-toggle="${sheet.id}"][aria-expanded]`).forEach((b) => b.setAttribute("aria-expanded", "false"));
      }
    };
    addEventListener("pointermove", move);
    addEventListener("pointerup", up);
  });
  document.addEventListener("click", (event) => {
    const sheet = event.target.classList?.contains("lt-popover") ? event.target : null;
    if (!sheet || !matchMedia("(max-width: 767.98px)").matches) return;
    if (event.clientY >= sheet.getBoundingClientRect().top) return;
    event.stopImmediatePropagation();
    sheet.hidden = true;
    document.querySelectorAll(`[data-lt-toggle="${sheet.id}"][aria-expanded]`).forEach((b) => b.setAttribute("aria-expanded", "false"));
  }, true);

  // ../miso/docs/mockup-system/project-assets/tablet-panel.js
  function mountTabletPanel({ root, scope }) {
    const panel = root.querySelector("[data-tp-root]");
    if (!panel) return;
    const $ = (s) => panel.querySelector(s), $$ = (s) => [...panel.querySelectorAll(s)];
    const toastEl = $("[data-tp-toast]");
    let undo = null, toastTimer = 0;
    const notify = (text, revert = null) => {
      $("[data-tp-toast-text]").textContent = text;
      undo = revert;
      toastEl.querySelector("[data-tp-undo]").hidden = !revert;
      toastEl.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastEl.hidden = true;
        undo = null;
      }, 5e3);
    };
    const open = (id) => {
      const el = root.querySelector("#" + id);
      if (el) el.hidden = false;
    };
    const close = (id) => {
      const el = root.querySelector("#" + id);
      if (el) el.hidden = true;
    };
    const picked = (dlg, key) => dlg.querySelector(`[data-tp-pick="${key}"].is-selected`)?.dataset.value;
    let water = 900;
    const goal = 2e3;
    const setWater = (ml) => {
      water = Math.max(0, ml);
      const pct = Math.min(100, Math.round(water / goal * 100));
      $("[data-tp-water]").textContent = water.toLocaleString("es-CO");
      $("[data-tp-ring]").style.setProperty("--value", pct);
      $("[data-tp-water-pct]").textContent = pct + "%";
      $("[data-tp-water-bar]").style.width = pct + "%";
    };
    const addWater = (drink, ml) => {
      const before = water;
      setWater(water + ml);
      notify(`${drink} ${ml} ml registrado`, () => setWater(before));
    };
    const setMood = (label) => {
      $$("[data-tp-mood]").forEach((b) => b.classList.toggle("is-selected", b.dataset.tpMood === label));
      $("[data-tp-mood-last]").textContent = label.split(" ")[0] + " ahora";
    };
    const habitCount = () => {
      const card = $$(".tp-habits [data-tp-habit]");
      $("[data-tp-habit-count]").textContent = card.filter((b) => b.classList.contains("is-done")).length + "/" + card.length;
    };
    const setHabit = (id, on) => {
      $$(`[data-tp-habit="${id}"]`).forEach((b) => {
        b.classList.toggle("is-done", on);
        b.setAttribute("aria-pressed", String(on));
      });
      habitCount();
    };
    const sheetRow = (html, done) => {
      const row = document.createElement("div");
      row.className = "tp-sheet-row" + (done ? " is-done" : "");
      row.innerHTML = html;
      return row;
    };
    const fillSheet = (title, rows) => {
      root.querySelector("#tp-day-dialog-title").textContent = title;
      const body = $("[data-tp-day-body]");
      body.replaceChildren(...rows);
      if (!rows.length) body.innerHTML = '<p class="lt-prose">Día libre: nada programado.</p>';
    };
    const fillDay = (index) => {
      const col = $(`[data-tp-day-col="${index}"]`);
      fillSheet(col.dataset.tpDayLabel, [...col.querySelectorAll(".tp-row, .tp-meal")].map((item) => sheetRow(item.innerHTML, item.classList.contains("is-done"))));
    };
    const fit = (box) => {
      const more = box.querySelector("[data-tp-more]");
      const all = [...box.querySelectorAll(".tp-row")];
      all.forEach((r) => r.classList.remove("is-overflow"));
      more.hidden = true;
      if (box.scrollHeight <= box.clientHeight) return;
      more.hidden = false;
      const rows = all.filter((r) => r.offsetParent !== null);
      let hidden = 0;
      for (let i = rows.length - 1; i >= 0 && box.scrollHeight > box.clientHeight; i--) {
        rows[i].classList.add("is-overflow");
        hidden++;
      }
      more.querySelector("b").textContent = hidden;
    };
    const fitAll = () => $$("[data-tp-fit]").forEach(fit);
    const observer = new ResizeObserver(fitAll);
    observer.observe($(".tp-week__days"));
    scope.cleanup?.(() => observer.disconnect());
    const tl = $("[data-tp-timeline]"), DAY_START = 360, DAY_END = 1410, WINDOW = 480, GAP = 45, now = Number(tl.dataset.now);
    const tlItems = [...tl.querySelectorAll("[data-tp-tl-items] li")].map((li) => ({ min: Number(li.dataset.min), time: li.dataset.time, kind: li.dataset.kind, done: li.hasAttribute("data-done"), title: li.textContent }));
    const icons = { habit: "bi-check2", meal: "bi-egg-fried", task: "bi-list-task", people: "bi-heart" };
    let start = Math.min(Math.max(Math.floor((now - 120) / 60) * 60, DAY_START), DAY_END - WINDOW), groups = [];
    const pos = (m) => (m - start) / WINDOW * 100 + "%";
    const renderTimeline = () => {
      const track = $("[data-tp-tl-track]");
      track.querySelectorAll(".tp-pin").forEach((p) => p.remove());
      groups = [];
      tlItems.filter((i) => i.min >= start && i.min <= start + WINDOW).forEach((i) => {
        const g = groups.at(-1);
        if (g && i.min - g[0].min < GAP) g.push(i);
        else groups.push([i]);
      });
      groups.forEach((g, index) => {
        const kinds = g.map((i) => i.kind);
        const kind = kinds.sort((a, b) => kinds.filter((k) => k === b).length - kinds.filter((k) => k === a).length)[0];
        const pin = document.createElement("button");
        pin.type = "button";
        pin.className = `tp-pin tp-pin--${kind}` + (g.every((i) => i.done || i.min < now) ? " is-past" : "") + (g.length > 1 ? " is-cluster" : "");
        pin.style.left = pos(g.reduce((s, i) => s + i.min, 0) / g.length);
        pin.dataset.tpCluster = index;
        pin.setAttribute("aria-haspopup", "dialog");
        pin.title = g.map((i) => `${i.time} · ${i.title}`).join(" / ");
        pin.setAttribute("aria-label", g.length > 1 ? `${g.length} elementos desde las ${g[0].time}` : `${g[0].time} ${g[0].title}`);
        pin.innerHTML = g.length > 1 ? `<b>${g.length}</b>` : `<i class="bi ${icons[kind]}"></i>`;
        track.append(pin);
      });
      const inside = now >= start && now <= start + WINDOW;
      const marker = $("[data-tp-tl-now]");
      marker.hidden = !inside;
      marker.style.left = pos(now);
      $("[data-tp-tl-past]").style.width = now <= start ? "0" : now >= start + WINDOW ? "100%" : pos(now);
      $("[data-tp-tl-scale]").innerHTML = Array.from({ length: WINDOW / 120 + 1 }, (_, k) => `<span style="left:${k * 25}%">${String((start + k * 120) / 60).padStart(2, "0")}:00</span>`).join("");
      tl.querySelector('[data-tp-tl-shift="-240"]').disabled = start <= DAY_START;
      tl.querySelector('[data-tp-tl-shift="240"]').disabled = start >= DAY_END - WINDOW;
    };
    renderTimeline();
    let focusLeft = 0, focusTimer = 0;
    const renderFocus = () => {
      $("[data-tp-focus-time]").textContent = String(Math.floor(focusLeft / 60)).padStart(2, "0") + ":" + String(focusLeft % 60).padStart(2, "0");
    };
    const stopFocus = () => {
      clearInterval(focusTimer);
      focusTimer = 0;
    };
    const runFocus = () => {
      stopFocus();
      focusTimer = setInterval(() => {
        focusLeft = Math.max(0, focusLeft - 1);
        renderFocus();
        if (!focusLeft) stopFocus();
      }, 1e3);
      $("[data-tp-focus-pause]").textContent = "Pausar";
    };
    scope.cleanup?.(() => {
      stopFocus();
      clearTimeout(toastTimer);
    });
    const closeFlyouts = (except) => $$(".tp-flyout").forEach((f) => {
      if (f !== except && !f.hidden) {
        f.hidden = true;
        $(`[data-lt-toggle="${f.id}"]`)?.setAttribute("aria-expanded", "false");
      }
    });
    scope.on(root, "click", (event) => {
      const t = event.target;
      if (!t.closest(".tp-rail__group")) closeFlyouts(null);
      const day = t.closest("[data-tp-day]");
      if (day) fillDay(day.dataset.tpDay);
      const shift = t.closest("[data-tp-tl-shift]");
      if (shift) {
        start = Math.min(Math.max(start + Number(shift.dataset.tpTlShift), DAY_START), DAY_END - WINDOW);
        renderTimeline();
        return;
      }
      const cluster = t.closest("[data-tp-cluster]");
      if (cluster) {
        const g = groups[cluster.dataset.tpCluster];
        fillSheet(g.length > 1 ? `${g[0].time} – ${g.at(-1).time} · ${g.length} elementos` : g[0].title, g.map((i) => sheetRow(`<i class="bi ${icons[i.kind]}"></i><small>${i.time}</small><span>${i.title}</span>`, i.done)));
        open("tp-day-dialog");
        return;
      }
      const drink = t.closest("[data-tp-drink]");
      if (drink) {
        addWater(drink.dataset.tpDrink, Number(drink.dataset.tpMl));
        return;
      }
      const mood = t.closest("[data-tp-mood]");
      if (mood) {
        const prev = $("[data-tp-mood].is-selected")?.dataset.tpMood;
        setMood(mood.dataset.tpMood);
        notify(`Ánimo: ${mood.dataset.tpMood}`, prev ? () => setMood(prev) : null);
        return;
      }
      const habit = t.closest("[data-tp-habit]");
      if (habit) {
        const id = habit.dataset.tpHabit, on = !habit.classList.contains("is-done");
        setHabit(id, on);
        notify(`${habit.querySelector("span:not([class])").textContent} ${on ? "completado" : "desmarcado"}`, () => setHabit(id, !on));
        return;
      }
      const layer = t.closest("[data-tp-layer]");
      if (layer) {
        const on = layer.getAttribute("aria-pressed") !== "true";
        layer.setAttribute("aria-pressed", String(on));
        $("[data-tp-week]").classList.toggle("hide-" + layer.dataset.tpLayer, !on);
        fitAll();
        return;
      }
      const pick = t.closest("[data-tp-pick]");
      if (pick) {
        pick.parentElement.querySelectorAll(`[data-tp-pick="${pick.dataset.tpPick}"]`).forEach((b) => b.classList.toggle("is-selected", b === pick));
        return;
      }
      const opener = t.closest("[data-tp-open]");
      if (opener) {
        close("tp-create-dialog");
        open(opener.dataset.tpOpen);
        return;
      }
      const snooze = t.closest("[data-tp-snooze]");
      if (snooze) {
        close("tp-task-dialog");
        notify(`Pospuesta: ${snooze.dataset.tpSnooze}`, () => {
        });
        return;
      }
      if (t.closest("[data-tp-complete-next]")) {
        const ev = $("[data-tp-sprint]");
        ev.classList.add("is-done");
        notify("Revisión sprint SGX completada", () => ev.classList.remove("is-done"));
        return;
      }
      if (t.closest("[data-tp-focus-start]")) {
        $$(".lt-dialog-layer").forEach((d) => {
          d.hidden = true;
        });
        focusLeft = 25 * 60;
        renderFocus();
        $("[data-tp-focus]").hidden = false;
        runFocus();
        return;
      }
      if (t.closest("[data-tp-focus-pause]")) {
        if (focusTimer) {
          stopFocus();
          t.textContent = "Seguir";
        } else runFocus();
        return;
      }
      if (t.closest("[data-tp-focus-stop]")) {
        stopFocus();
        $("[data-tp-focus]").hidden = true;
        notify(`Sesión de foco registrada: ${25 - Math.ceil(focusLeft / 60)} min`);
        return;
      }
      if (t.closest("[data-tp-shop-item]")) {
        const left = $$("[data-tp-shop-item]").filter((i) => !i.checked).length;
        $("[data-tp-shop-count]").textContent = left + (left === 1 ? " compra" : " compras");
        return;
      }
      const action = t.closest('[data-lt-action^="tp-"]');
      if (action) {
        const dlg = action.closest(".lt-dialog-layer"), name = action.dataset.ltAction;
        if (name === "tp-water-save") {
          const custom = Number(dlg.querySelector(".tp-custom input").value);
          addWater(picked(dlg, "drink") || "Agua", custom || Number(picked(dlg, "ml") || 250));
        }
        if (name === "tp-mood-save") {
          const label = picked(dlg, "mood");
          if (label) setMood(label);
          notify("Ánimo y energía guardados");
        }
        if (name === "tp-task-done") {
          const ev = $("[data-tp-sprint]");
          ev.classList.add("is-done");
          notify("Tarea completada", () => ev.classList.remove("is-done"));
        }
        if (name === "tp-goal-save") {
          const id = picked(dlg, "goal");
          const bar = $(`[data-tp-goal-bar="${id}"]`);
          const before = bar.style.width;
          bar.style.width = Math.min(100, parseFloat(before) + 10) + "%";
          notify("Avance registrado", () => {
            bar.style.width = before;
          });
        }
        const messages = { "tp-plan-visit": "Visita registrada en el plan", "tp-avoid-log": "Recaída registrada. Mañana es un nuevo día.", "tp-journal-save": "Entrada del diario guardada", "tp-task-create": "Tarea creada" };
        if (messages[name]) notify(messages[name]);
        close(dlg.id);
        return;
      }
      if (t.closest("[data-tp-undo]")) {
        undo?.();
        undo = null;
        toastEl.hidden = true;
        return;
      }
      const night = t.closest("[data-tp-night]");
      if (night) {
        const on = panel.classList.toggle("is-night");
        night.setAttribute("aria-pressed", String(on));
        night.querySelector("i").className = on ? "bi bi-sun" : "bi bi-moon";
        return;
      }
      if (t.closest("[data-tp-ambient]")) {
        const amb = $(".tp-ambient");
        amb.hidden = !amb.hidden;
      }
    });
  }

  // ../miso/docs/mockup-system/mockups/tablet-panel/scripts/entry.js
  startMockup({ "panel": (ctx) => {
    mountLifeShell(ctx);
    mountTabletPanel(ctx);
  } });
})();
</script></body></html>
